name: CPU scaffold checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned CPU-only dependency used by observer serialization tests
        run: python -m pip install --requirement tests/requirements-cpu.txt
      - name: Unit tests (no GPU or model downloads)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate proposed contracts
        run: PYTHONPATH=src python -m megartx validate configs
      - name: Compile Python
        run: python -m compileall -q src tests
