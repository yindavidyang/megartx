name: Independent NVFP4 CPU reference
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  numerical-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned CPU-only reference dependency
        run: python -m pip install --requirement numerical_reference/requirements-cpu.txt
      - name: Independent format and synthetic scale checks
        run: python -m unittest discover -s numerical_reference -v
      - name: Exhaustive q-times-scale representation check
        run: python numerical_reference/nvfp4_reference.py --self-test-summary
      - name: Compile CPU reference
        run: python -m compileall -q numerical_reference
